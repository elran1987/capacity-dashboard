<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resource Allocation, Jira & Git Dashboard</title>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- SheetJS for Excel / CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg-slate-950: #020617;
            --bg-slate-900: #0f172a;
            --bg-slate-800: #1e293b;
            --border-slate-800: #334155;
            --text-slate-100: #f1f5f9;
            --text-slate-400: #94a3b8;
            --cyan-400: #22d3ee;
            --cyan-500: #06b6d4;
            --emerald-400: #34d399;
            --rose-400: #fb7185;
            --blue-400: #60a5fa;
            --purple-400: #c084fc;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-slate-950); color: var(--text-slate-100); min-height: 100vh; padding: 24px; }

        .dashboard-layout {
            max-width: 1600px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 24px;
        }

        @media (max-width: 1024px) {
            .dashboard-layout { grid-template-columns: 1fr; }
        }

        /* Sidebar */
        .sidebar { display: flex; flex-direction: column; gap: 20px; }
        .panel { background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border-slate-800); border-radius: 16px; padding: 20px; }
        .panel h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-slate-400); margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 12px; color: var(--text-slate-400); margin-bottom: 6px; font-weight: 500; }
        .form-group select, .form-group input { width: 100%; background: var(--bg-slate-900); border: 1px solid var(--border-slate-800); border-radius: 10px; padding: 10px; color: white; font-size: 13px; outline: none; }
        .form-group select:focus, .form-group input:focus { border-color: var(--cyan-500); }

        .btn-reset { width: 100%; background: var(--bg-slate-800); color: var(--text-slate-100); border: 1px solid var(--border-slate-800); padding: 10px; border-radius: 10px; font-size: 13px; font-weight: 500; cursor: pointer; transition: 0.2s; }
        .btn-reset:hover { background: var(--border-slate-800); color: var(--cyan-400); }

        .top-projects-list { display: flex; flex-direction: column; gap: 8px; max-height: 350px; overflow-y: auto; }
        .project-fte-item { display: flex; justify-content: space-between; align-items: center; background: rgba(30, 41, 59, 0.4); padding: 8px 12px; border-radius: 8px; font-size: 13px; cursor: pointer; transition: background 0.2s; }
        .project-fte-item:hover { background: rgba(30, 41, 59, 0.8); }
        .project-fte-badge { background: rgba(6, 182, 212, 0.1); color: var(--cyan-400); padding: 2px 8px; border-radius: 6px; font-weight: bold; font-size: 12px; border: 1px solid rgba(6, 182, 212, 0.2); }

        /* Main Content */
        .main-content { display: flex; flex-direction: column; gap: 24px; }
        
        /* Tabs Bar */
        .tabs-header { display: flex; gap: 12px; border-bottom: 1px solid var(--border-slate-800); padding-bottom: 12px; }
        .tab-btn { background: var(--bg-slate-900); border: 1px solid var(--border-slate-800); color: var(--text-slate-400); padding: 8px 18px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .tab-btn.active { background: var(--cyan-500); color: var(--bg-slate-950); border-color: var(--cyan-500); }

        .charts-row { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; }
        @media (max-width: 1200px) { .charts-row { grid-template-columns: 1fr; } }

        .chart-card { background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border-slate-800); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
        .chart-container { position: relative; height: 320px; width: 100%; }

        /* Table Section */
        .table-card { background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border-slate-800); border-radius: 16px; overflow: hidden; }
        .table-header { padding: 16px 20px; border-bottom: 1px solid var(--border-slate-800); display: flex; justify-content: space-between; align-items: center; }
        .table-header h3 { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }

        .actions-bar { display: flex; gap: 10px; align-items: center; }
        button.primary, label.btn-upload { background: var(--cyan-500); color: var(--bg-slate-950); border: none; padding: 8px 16px; border-radius: 10px; font-size: 13px; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
        button.primary:hover, label.btn-upload:hover { background: var(--cyan-400); }
        input[type="file"] { display: none; }

        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
        th { background: rgba(15, 23, 42, 0.9); color: var(--text-slate-400); text-transform: uppercase; font-size: 11px; padding: 12px 16px; border-bottom: 1px solid var(--border-slate-800); cursor: pointer; user-select: none; }
        th:hover { color: var(--cyan-400); }
        td { padding: 14px 16px; border-bottom: 1px solid rgba(51, 65, 85, 0.4); }
        tr:hover td { background: rgba(30, 41, 59, 0.3); }

        .badge { background: var(--bg-slate-800); padding: 4px 8px; border-radius: 6px; font-size: 11px; border: 1px solid var(--border-slate-800); color: var(--purple-400); font-weight: 500; }
        .fte-bar-container { display: flex; align-items: center; gap: 10px; }
        .fte-bar { height: 6px; border-radius: 3px; background: var(--cyan-400); }

        /* Modal styling */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(2, 6, 23, 0.8); display: flex; justify-content: center; align-items: center; z-index: 1000; opacity: 0; pointer-events: none; transition: 0.2s; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal { background: var(--bg-slate-900); border: 1px solid var(--border-slate-800); border-radius: 16px; padding: 24px; width: 420px; display: flex; flex-direction: column; gap: 14px; }
        .modal h3 { font-size: 16px; color: white; margin-bottom: 2px; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; }
        .btn-secondary { background: var(--bg-slate-800); color: var(--text-slate-100); border: 1px solid var(--border-slate-800); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; }
        .btn-secondary:hover { background: var(--border-slate-800); }
    </style>
</head>
<body onload="initDashboard()">

    <div class="dashboard-layout">
        <!-- Sidebar: Filters & Quick Project Totals -->
        <div class="sidebar">
            <div class="panel">
                <h3>🔍 Filters & Controls</h3>
                <div class="form-group">
                    <label>Project</label>
                    <select id="filter-project" onchange="updateDashboard()">
                        <option value="">All Projects</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Role / Discipline</label>
                    <select id="filter-role" onchange="updateDashboard()">
                        <option value="">All Roles</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Location</label>
                    <select id="filter-location" onchange="updateDashboard()">
                        <option value="">All Locations</option>
                    </select>
                </div>
                <button class="btn-reset" onclick="resetFilters()">Reset Filters</button>
            </div>

            <div class="panel">
                <h3>
                    <span>📊 Project FTE</span>
                    <select id="project-sort-mode" onchange="updateDashboard()" style="background: var(--bg-slate-900); border: 1px solid var(--border-slate-800); color: var(--text-slate-100); font-size: 11px; padding: 2px 6px; border-radius: 6px; outline: none; cursor: pointer;">
                        <option value="fte-desc">FTE: High to Low</option>
                        <option value="fte-asc">FTE: Low to High</option>
                        <option value="name-asc">Name: A-Z</option>
                    </select>
                </h3>
                <div id="project-fte-list" class="top-projects-list">
                    <!-- Loaded dynamically -->
                </div>
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="main-content">
            <!-- Tabs Navigation -->
            <div class="tabs-header">
                <button class="tab-btn active" id="tab-btn-resources" onclick="switchTab('resources')">👥 Resources Allocation</button>
                <button class="tab-btn" id="tab-btn-jira" onclick="switchTab('jira')">🎫 Jira Issues</button>
                <button class="tab-btn" id="tab-btn-git" onclick="switchTab('git')">💻 Git Activity</button>
            </div>

            <!-- Charts Row -->
            <div class="charts-row" id="charts-section">
                <div class="chart-card">
                    <h3 id="chart-title-left" style="font-size: 14px; color: white; display: flex; align-items: center; gap: 8px;">
                        <span>📊</span> Project FTE Burden & Role Distribution (Click bar to filter)
                    </h3>
                    <div class="chart-container">
                        <canvas id="chartProjectFTE"></canvas>
                    </div>
                </div>
                <div class="chart-card">
                    <h3 id="chart-title-right" style="font-size: 14px; color: white; display: flex; align-items: center; gap: 8px;">
                        <span>🍩</span> Organization Composition
                    </h3>
                    <div class="chart-container">
                        <canvas id="chartOrgComposition"></canvas>
                    </div>
                </div>
            </div>

            <!-- Table Section -->
            <div class="table-card">
                <div class="table-header">
                    <h3 id="table-title">👥 Interactive Resource Table & Edit Suite</h3>
                    <div class="actions-bar">
                        <label class="btn-upload">
                            📂 Import Excel / CSV / JSON
                            <input type="file" accept=".csv, .xlsx, .xls, .json" onchange="handleFileUpload(event)">
                        </label>
                        <button class="primary" id="btn-add-action" onclick="openModal()">+ Add Employee</button>
                    </div>
                </div>
                <div style="overflow-x: auto;">
                    <table id="main-table">
                        <thead>
                            <tr id="table-header-row"></tr>
                        </thead>
                        <tbody id="resource-table-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Form for Add / Edit -->
    <div class="modal-overlay" id="employeeModal">
        <div class="modal">
            <h3 id="modal-title">Add New Employee</h3>
            <input type="hidden" id="edit-index" value="-1">
            <div id="modal-form-body" style="display: flex; flex-direction: column; gap: 14px;">
                <!-- Dynamically adjusted based on active tab -->
            </div>
            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="primary" onclick="saveRecord()">Save</button>
            </div>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        let currentTab = 'resources';

        let employeeData = [
            { Name: "Adriana Iovanut", Role: "Ro TL", Location: "Romania", Project: "Management", FTE: 1.0 },
            { Name: "Alexandru Mihai", Role: "BE", Location: "Romania", Project: "Vasco", FTE: 1.0 },
            { Name: "alexandru.roman", Role: "QA Automation", Location: "Romania", Project: "Fenix", FTE: 0.33 },
            { Name: "alexandru.roman", Role: "QA Automation", Location: "Romania", Project: "Netivot", FTE: 0.33 },
            { Name: "alexandru.roman", Role: "QA Automation", Location: "Romania", Project: "DNP", FTE: 0.34 }
        ];

        let jiraData = [
            { Assignee: "Alexandru Mihai", Project: "Vasco", FromStatus: "In Progress", ToStatus: "Done", Issues: "VAS-102" }
        ];

        let gitData = [
            { Developer: "alexandru.roman", Repository: "Fenix-Core", Commits: 14, PRs: 3 }
        ];

        let currentSortCol = 'FTE';
        let currentSortAsc = false;
        let charts = {};

        const vibrantColors = [
            '#3b82f6', '#22d3ee', '#34d399', '#c084fc', '#fb7185', 
            '#fb923c', '#facc15', '#a855f7', '#ec4899', '#14b8a6', '#6366f1'
        ];

        function initDashboard() {
            populateDropdowns();
            updateDashboard();
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tab-btn-${tab}`).classList.add('active');

            const chartsSection = document.getElementById('charts-section');
            const btnAdd = document.getElementById('btn-add-action');

            if (tab === 'resources') {
                chartsSection.style.display = 'grid';
                btnAdd.style.display = 'inline-flex';
                btnAdd.innerText = '+ Add Employee';
                currentSortCol = 'FTE';
                currentSortAsc = false;
            } else if (tab === 'jira') {
                chartsSection.style.display = 'none';
                btnAdd.style.display = 'inline-flex';
                btnAdd.innerText = '+ Add Jira Issue';
                currentSortCol = 'Assignee';
                currentSortAsc = true;
            } else if (tab === 'git') {
                chartsSection.style.display = 'grid';
                btnAdd.style.display = 'inline-flex';
                btnAdd.innerText = '+ Add Git Record';
                currentSortCol = 'Developer';
                currentSortAsc = true;
            }
            updateDashboard();
        }

        function populateDropdowns() {
            const projects = [...new Set(employeeData.map(e => e.Project))].filter(Boolean).sort();
            const roles = [...new Set(employeeData.map(e => e.Role))].filter(Boolean).sort();
            const locations = [...new Set(employeeData.map(e => e.Location))].filter(Boolean).sort();

            fillSelect('filter-project', projects, 'All Projects');
            fillSelect('filter-role', roles, 'All Roles');
            fillSelect('filter-location', locations, 'All Locations');
        }

        function fillSelect(id, items, defaultText) {
            const el = document.getElementById(id);
            if (!el) return;
            const current = el.value;
            el.innerHTML = `<option value="">${defaultText}</option>` + items.map(i => `<option value="${i}" ${i === current ? 'selected' : ''}>${i}</option>`).join('');
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            const fileName = file.name.toLowerCase();

            if (fileName.endsWith('.json')) {
                reader.onload = function(e) {
                    try {
                        const parsed = JSON.parse(e.target.result);
                        const json = Array.isArray(parsed) ? parsed : (parsed.data || parsed.issues || parsed.commits || [parsed]);
                        processParsedData(json);
                    } catch (err) {
                        console.error(err);
                        alert("Error parsing JSON file.");
                    }
                };
                reader.readAsText(file);
            } else {
                reader.onload = function(e) {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                        const rawJson = XLSX.utils.sheet_to_json(worksheet, { defval: '' });
                        if (rawJson.length === 0) { alert("File is empty."); return; }
                        processParsedData(rawJson);
                    } catch (err) {
                        console.error(err);
                        alert("Error reading file.");
                    }
                };
                reader.readAsArrayBuffer(file);
            }
            event.target.value = '';
        }

        function processParsedData(json) {
            if (!json || json.length === 0) return;

            // בדיקה ישירה מה-DOM של הטאב הפעיל כרגע כדי לוודא 100% התאמה לממשק
            let activeTab = currentTab;
            if (document.getElementById('tab-btn-jira').classList.contains('active')) activeTab = 'jira';
            else if (document.getElementById('tab-btn-git').classList.contains('active')) activeTab = 'git';
            else if (document.getElementById('tab-btn-resources').classList.contains('active')) activeTab = 'resources';

            if (activeTab === 'jira') {
                jiraData = json.map(row => {
                    const r = {};
                    Object.keys(row).forEach(k => r[k.toLowerCase().trim()] = row[k]);
                    return {
                        Assignee: r.assignee || r['user'] || r['name'] || '',
                        Project: r.project || '',
                        FromStatus: r['from status'] || r.fromstatus || r['from'] || '',
                        ToStatus: r['to status'] || r.tostatus || r['to'] || '',
                        Issues: r.issues || r['issue'] || r['key'] || ''
                    };
                }).filter(j => j.Assignee || j.Issues);
                alert(`Successfully imported ${jiraData.length} Jira records!`);

            } else if (activeTab === 'git') {
                gitData = json.map(row => {
                    const r = {};
                    Object.keys(row).forEach(k => r[k.toLowerCase().trim()] = row[k]);
                    return {
                        Developer: r.developer || r['name'] || r['author'] || '',
                        Repository: r.repository || r['repo'] || '',
                        Commits: parseInt(r.commits || r['commit count'] || 0),
                        PRs: parseInt(r.prs || r['pull requests'] || 0)
                    };
                }).filter(g => g.Developer || g.Repository);
                alert(`Successfully imported ${gitData.length} Git records!`);

            } else {
                // טאב Resources בלבד - מעבד אך ורק כמבנה משאבים
                employeeData = json.map(row => {
                    let name = '', role = '', location = '', project = '';
                    let fte = 1.0;

                    for (let k of Object.keys(row)) {
                        const val = row[k];
                        const lk = k.toLowerCase().trim();
                        
                        if ((lk.includes('name') || lk === 'שם') && !lk.includes('project')) {
                            name = val;
                        } else if (lk.includes('role') || lk.includes('תפקיד')) {
                            role = val;
                        } else if (lk.includes('location') || lk.includes('מיקום') || lk.includes('country')) {
                            location = val;
                        } else if (lk.includes('project') || lk.includes('פרויקט')) {
                            project = val;
                        } else if (lk.includes('fte') || lk.includes('%') || lk.includes('allocation') || lk.includes('הקצאה')) {
                            const parsed = parseFloat(val);
                            if (!isNaN(parsed)) fte = parsed;
                        }
                    }

                    const vals = Object.values(row);
                    if (!name && vals.length > 0) name = vals[0];
                    if (!role && vals.length > 1) role = vals[1];
                    if (!location && vals.length > 2) location = vals[2];
                    if (!project && vals.length > 3) project = vals[3];
                    if (fte === 1.0 && vals.length > 4) {
                        const p = parseFloat(vals[4]);
                        if (!isNaN(p)) fte = p;
                    }

                    return {
                        Name: String(name || '').trim(),
                        Role: String(role || '').trim(),
                        Location: String(location || '').trim(),
                        Project: String(project || '').trim(),
                        FTE: isNaN(fte) ? 1.0 : fte
                    };
                }).filter(e => e.Name);

                populateDropdowns();
                alert(`Successfully imported ${employeeData.length} resources!`);
            }
            updateDashboard();
        }

        function getFilteredResources() {
            const proj = document.getElementById('filter-project').value;
            const role = document.getElementById('filter-role').value;
            const loc = document.getElementById('filter-location').value;

            return employeeData.filter(emp => {
                if (proj && emp.Project !== proj) return false;
                if (role && emp.Role !== role) return false;
                if (loc && emp.Location !== loc) return false;
                return true;
            });
        }

        function updateDashboard() {
            if (currentTab === 'resources') {
                document.getElementById('table-title').innerHTML = "👥 Interactive Resource Table & Edit Suite";
                const filtered = getFilteredResources();

                filtered.sort((a, b) => {
                    let valA = a[currentSortCol], valB = b[currentSortCol];
                    if (typeof valA === 'string') { valA = valA.toLowerCase(); valB = valB.toLowerCase(); }
                    return valA < valB ? (currentSortAsc ? -1 : 1) : (valA > valB ? (currentSortAsc ? 1 : -1) : 0);
                });

                renderResourceTable(filtered);
                renderSidebarProjectFTE();
                renderResourceCharts(filtered);
            } else if (currentTab === 'jira') {
                document.getElementById('table-title').innerHTML = "🎫 Jira Issues Tracking";
                const proj = document.getElementById('filter-project').value;
                let filteredJira = jiraData.filter(j => !proj || j.Project === proj);

                filteredJira.sort((a, b) => {
                    let valA = a[currentSortCol], valB = b[currentSortCol];
                    if (typeof valA === 'string') { valA = valA.toLowerCase(); valB = valB.toLowerCase(); }
                    return valA < valB ? (currentSortAsc ? -1 : 1) : (valA > valB ? (currentSortAsc ? 1 : -1) : 0);
                });

                renderJiraTable(filteredJira);
            } else if (currentTab === 'git') {
                document.getElementById('table-title').innerHTML = "💻 Git Commit & PR Activity";
                let filteredGit = [...gitData];

                filteredGit.sort((a, b) => {
                    let valA = a[currentSortCol], valB = b[currentSortCol];
                    if (typeof valA === 'string') { valA = valA.toLowerCase(); valB = valB.toLowerCase(); }
                    return valA < valB ? (currentSortAsc ? -1 : 1) : (valA > valB ? (currentSortAsc ? 1 : -1) : 0);
                });

                renderGitTable(filteredGit);
                renderGitCharts();
            }
        }

        function renderResourceTable(data) {
            const getSortIndicator = (col) => {
                if (currentSortCol !== col) return ' ↕';
                return currentSortAsc ? ' ▲' : ' ▼';
            };

            document.getElementById('table-header-row').innerHTML = `
                <th onclick="sortTable('Name')">Name${getSortIndicator('Name')}</th>
                <th onclick="sortTable('Role')">Role${getSortIndicator('Role')}</th>
                <th onclick="sortTable('Location')">Location${getSortIndicator('Location')}</th>
                <th onclick="sortTable('Project')">Project${getSortIndicator('Project')}</th>
                <th onclick="sortTable('FTE')" style="text-align: right;">FTE / % Project${getSortIndicator('FTE')}</th>
                <th style="text-align: center;">Actions</th>
            `;

            const tbody = document.getElementById('resource-table-body');
            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--text-slate-400); padding: 32px;">No matching records found.</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map(emp => {
                const globalIdx = employeeData.indexOf(emp);
                const ftePercent = Math.min(Math.max(emp.FTE * 100, 0), 100);
                return `
                    <tr>
                        <td style="font-weight: 500; color: white;">${emp.Name}</td>
                        <td><span class="badge">${emp.Role}</span></td>
                        <td style="color: var(--text-slate-400);">${emp.Location}</td>
                        <td style="color: var(--cyan-400); font-weight: 500;">${emp.Project}</td>
                        <td style="text-align: right;">
                            <div class="fte-bar-container" style="justify-content: flex-end;">
                                <span style="font-weight: bold; color: var(--emerald-400);">${emp.FTE}</span>
                                <div style="width: 60px; background: rgba(51, 65, 85, 0.5); border-radius: 3px; overflow: hidden;">
                                    <div class="fte-bar" style="width: ${ftePercent}%;"></div>
                                </div>
                            </div>
                        </td>
                        <td style="text-align: center;">
                            <button onclick="editEmployee(${globalIdx})" style="background: none; border: none; cursor: pointer; color: var(--blue-400); font-size: 14px; margin-right: 8px;" title="Edit">✏️</button>
                            <button onclick="deleteEmployee(${globalIdx})" style="background: none; border: none; cursor: pointer; color: var(--rose-400); font-size: 14px;" title="Delete">🗑️</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function renderJiraTable(data) {
            const getSortIndicator = (col) => {
                if (currentSortCol !== col) return ' ↕';
                return currentSortAsc ? ' ▲' : ' ▼';
            };

            document.getElementById('table-header-row').innerHTML = `
                <th onclick="sortTable('Assignee')">Assignee${getSortIndicator('Assignee')}</th>
                <th onclick="sortTable('Project')">Project${getSortIndicator('Project')}</th>
                <th onclick="sortTable('FromStatus')">From Status${getSortIndicator('FromStatus')}</th>
                <th onclick="sortTable('ToStatus')">To Status${getSortIndicator('ToStatus')}</th>
                <th onclick="sortTable('Issues')">Issues${getSortIndicator('Issues')}</th>
                <th style="text-align: center;">Actions</th>
            `;

            const tbody = document.getElementById('resource-table-body');
            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--text-slate-400); padding: 32px;">No Jira data available.</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map((j) => {
                const globalIdx = jiraData.indexOf(j);
                return `
                    <tr>
                        <td style="font-weight: 500; color: white;">${j.Assignee}</td>
                        <td style="color: var(--cyan-400);">${j.Project}</td>
                        <td><span class="badge">${j.FromStatus}</span></td>
                        <td><span class="badge" style="color: var(--emerald-400);">${j.ToStatus}</span></td>
                        <td style="font-weight: bold; color: var(--blue-400);">${j.Issues}</td>
                        <td style="text-align: center;">
                            <button onclick="editJira(${globalIdx})" style="background: none; border: none; cursor: pointer; color: var(--blue-400); font-size: 14px; margin-right: 8px;" title="Edit">✏️</button>
                            <button onclick="deleteJira(${globalIdx})" style="background: none; border: none; cursor: pointer; color: var(--rose-400); font-size: 14px;" title="Delete">🗑️</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function renderGitTable(data) {
            const getSortIndicator = (col) => {
                if (currentSortCol !== col) return ' ↕';
                return currentSortAsc ? ' ▲' : ' ▼';
            };

            document.getElementById('table-header-row').innerHTML = `
                <th onclick="sortTable('Developer')">Developer${getSortIndicator('Developer')}</th>
                <th onclick="sortTable('Repository')">Repository${getSortIndicator('Repository')}</th>
                <th onclick="sortTable('Commits')" style="text-align: right;">Commits${getSortIndicator('Commits')}</th>
                <th onclick="sortTable('PRs')" style="text-align: right;">PRs${getSortIndicator('PRs')}</th>
                <th style="text-align: center;">Actions</th>
            `;

            const tbody = document.getElementById('resource-table-body');
            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-slate-400); padding: 32px;">No Git data available.</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map((g) => {
                const globalIdx = gitData.indexOf(g);
                return `
                    <tr>
                        <td style="font-weight: 500; color: white;">${g.Developer}</td>
                        <td style="color: var(--purple-400);">${g.Repository}</td>
                        <td style="text-align: right; font-weight: bold; color: var(--emerald-400);">${g.Commits}</td>
                        <td style="text-align: right; font-weight: bold; color: var(--cyan-400);">${g.PRs}</td>
                        <td style="text-align: center;">
                            <button onclick="editGit(${globalIdx})" style="background: none; border: none; cursor: pointer; color: var(--blue-400); font-size: 14px; margin-right: 8px;" title="Edit">✏️</button>
                            <button onclick="deleteGit(${globalIdx})" style="background: none; border: none; cursor: pointer; color: var(--rose-400); font-size: 14px;" title="Delete">🗑️</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function renderSidebarProjectFTE() {
            const map = {};
            employeeData.forEach(e => { if(e.Project) map[e.Project] = (map[e.Project] || 0) + (e.FTE || 0); });
            
            let sorted = Object.entries(map);
            const sortMode = document.getElementById('project-sort-mode').value;

            if (sortMode === 'fte-desc') sorted.sort((a, b) => b[1] - a[1]);
            else if (sortMode === 'fte-asc') sorted.sort((a, b) => a[1] - b[1]);
            else if (sortMode === 'name-asc') sorted.sort((a, b) => a[0].localeCompare(b[0]));

            const container = document.getElementById('project-fte-list');
            if (sorted.length === 0) {
                container.innerHTML = `<div style="font-size: 12px; color: var(--text-slate-400); text-align: center; padding: 10px;">No projects found</div>`;
                return;
            }

            container.innerHTML = sorted.map(([proj, fte]) => `
                <div class="project-fte-item" onclick="filterByProject('${proj}')">
                    <span style="color: white; font-weight: 500;">${proj}</span>
                    <span class="project-fte-badge">${Math.round(fte * 100) / 100} FTE</span>
                </div>
            `).join('');
        }

        function filterByProject(projName) {
            document.getElementById('filter-project').value = projName;
            updateDashboard();
        }

        function sortTable(col) {
            if (currentSortCol === col) {
                currentSortAsc = !currentSortAsc;
            } else {
                currentSortCol = col;
                currentSortAsc = (col === 'FTE' || col === 'Commits' || col === 'PRs') ? false : true;
            }
            updateDashboard();
        }

        function resetFilters() {
            document.getElementById('filter-project').value = '';
            document.getElementById('filter-role').value = '';
            document.getElementById('filter-location').value = '';
            updateDashboard();
        }

        function renderResourceCharts(filteredEmps) {
            const projMap = {};
            filteredEmps.forEach(e => { if(e.Project) projMap[e.Project] = (projMap[e.Project] || 0) + (e.FTE || 0); });
            const projLabels = Object.keys(projMap);
            const projValues = Object.values(projMap);

            if (charts.projectFTE) charts.projectFTE.destroy();
            const ctx1 = document.getElementById('chartProjectFTE').getContext('2d');
            charts.projectFTE = new Chart(ctx1, {
                type: 'bar',
                data: {
                    labels: projLabels,
                    datasets: [{
                        label: 'Total FTE',
                        data: projValues,
                        backgroundColor: '#22d3ee',
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { ticks: { color: '#94a3b8' }, grid: { display: false } },
                        y: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }
                    },
                    onClick: (e, els) => {
                        if (els.length > 0) {
                            const idx = els[0].index;
                            filterByProject(projLabels[idx]);
                        }
                    }
                }
            });

            const roleMap = {};
            filteredEmps.forEach(e => { if(e.Role) roleMap[e.Role] = (roleMap[e.Role] || 0) + 1; });
            const roleLabels = Object.keys(roleMap);
            const roleValues = Object.values(roleMap);

            if (charts.orgComp) charts.orgComp.destroy();
            const ctx2 = document.getElementById('chartOrgComposition').getContext('2d');
            charts.orgComp = new Chart(ctx2, {
                type: 'doughnut',
                data: {
                    labels: roleLabels,
                    datasets: [{
                        data: roleValues,
                        backgroundColor: vibrantColors.slice(0, roleLabels.length)
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom', labels: { color: '#f1f5f9', boxWidth: 12 } } }
                }
            });
        }

        function renderGitCharts() {
            const repoMap = {};
            gitData.forEach(g => { if(g.Repository) repoMap[g.Repository] = (repoMap[g.Repository] || 0) + (g.Commits || 0); });
            const labels = Object.keys(repoMap);
            const values = Object.values(repoMap);

            if (charts.projectFTE) charts.projectFTE.destroy();
            const ctx1 = document.getElementById('chartProjectFTE').getContext('2d');
            charts.projectFTE = new Chart(ctx1, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Commits per Repo',
                        data: values,
                        backgroundColor: '#c084fc',
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { ticks: { color: '#94a3b8' }, grid: { display: false } },
                        y: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }
                    }
                }
            });

            const prMap = {};
            gitData.forEach(g => { if(g.Developer) prMap[g.Developer] = (prMap[g.Developer] || 0) + (g.PRs || 0); });
            if (charts.orgComp) charts.orgComp.destroy();
            const ctx2 = document.getElementById('chartOrgComposition').getContext('2d');
            charts.orgComp = new Chart(ctx2, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(prMap),
                    datasets: [{
                        data: Object.values(prMap),
                        backgroundColor: vibrantColors.slice(0, Object.keys(prMap).length)
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom', labels: { color: '#f1f5f9', boxWidth: 12 } } }
                }
            });
        }

        function openModal() {
            document.getElementById('edit-index').value = -1;
            const title = currentTab === 'resources' ? 'Add New Employee' : currentTab === 'jira' ? 'Add Jira Issue' : 'Add Git Record';
            document.getElementById('modal-title').innerText = title;
            
            const formBody = document.getElementById('modal-form-body');
            if (currentTab === 'resources') {
                formBody.innerHTML = `
                    <div class="form-group" style="margin:0;"><label>Name</label><input type="text" id="m-name"></div>
                    <div class="form-group" style="margin:0;"><label>Role</label><input type="text" id="m-role"></div>
                    <div class="form-group" style="margin:0;"><label>Location</label><input type="text" id="m-location"></div>
                    <div class="form-group" style="margin:0;"><label>Project</label><input type="text" id="m-project"></div>
                    <div class="form-group" style="margin:0;"><label>FTE</label><input type="number" step="0.01" id="m-fte" value="1.0"></div>
                `;
            } else if (currentTab === 'jira') {
                formBody.innerHTML = `
                    <div class="form-group" style="margin:0;"><label>Assignee</label><input type="text" id="m-assignee"></div>
                    <div class="form-group" style="margin:0;"><label>Project</label><input type="text" id="m-proj"></div>
                    <div class="form-group" style="margin:0;"><label>From Status</label><input type="text" id="m-from"></div>
                    <div class="form-group" style="margin:0;"><label>To Status</label><input type="text" id="m-to"></div>
                    <div class="form-group" style="margin:0;"><label>Issues</label><input type="text" id="m-issues"></div>
                `;
            } else if (currentTab === 'git') {
                formBody.innerHTML = `
                    <div class="form-group" style="margin:0;"><label>Developer</label><input type="text" id="m-dev"></div>
                    <div class="form-group" style="margin:0;"><label>Repository</label><input type="text" id="m-repo"></div>
                    <div class="form-group" style="margin:0;"><label>Commits</label><input type="number" id="m-commits" value="0"></div>
                    <div class="form-group" style="margin:0;"><label>PRs</label><input type="number" id="m-prs" value="0"></div>
                `;
            }
            document.getElementById('employeeModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('employeeModal').classList.remove('active');
        }

        function editEmployee(idx) {
            const emp = employeeData[idx];
            document.getElementById('edit-index').value = idx;
            document.getElementById('modal-title').innerText = 'Edit Employee';
            document.getElementById('modal-form-body').innerHTML = `
                <div class="form-group" style="margin:0;"><label>Name</label><input type="text" id="m-name" value="${emp.Name}"></div>
                <div class="form-group" style="margin:0;"><label>Role</label><input type="text" id="m-role" value="${emp.Role}"></div>
                <div class="form-group" style="margin:0;"><label>Location</label><input type="text" id="m-location" value="${emp.Location}"></div>
                <div class="form-group" style="margin:0;"><label>Project</label><input type="text" id="m-project" value="${emp.Project}"></div>
                <div class="form-group" style="margin:0;"><label>FTE</label><input type="number" step="0.01" id="m-fte" value="${emp.FTE}"></div>
            `;
            document.getElementById('employeeModal').classList.add('active');
        }

        function editJira(idx) {
            const j = jiraData[idx];
            document.getElementById('edit-index').value = idx;
            document.getElementById('modal-title').innerText = 'Edit Jira Issue';
            document.getElementById('modal-form-body').innerHTML = `
                <div class="form-group" style="margin:0;"><label>Assignee</label><input type="text" id="m-assignee" value="${j.Assignee}"></div>
                <div class="form-group" style="margin:0;"><label>Project</label><input type="text" id="m-proj" value="${j.Project}"></div>
                <div class="form-group" style="margin:0;"><label>From Status</label><input type="text" id="m-from" value="${j.FromStatus}"></div>
                <div class="form-group" style="margin:0;"><label>To Status</label><input type="text" id="m-to" value="${j.ToStatus}"></div>
                <div class="form-group" style="margin:0;"><label>Issues</label><input type="text" id="m-issues" value="${j.Issues}"></div>
            `;
            document.getElementById('employeeModal').classList.add('active');
        }

        function editGit(idx) {
            const g = gitData[idx];
            document.getElementById('edit-index').value = idx;
            document.getElementById('modal-title').innerText = 'Edit Git Record';
            document.getElementById('modal-form-body').innerHTML = `
                <div class="form-group" style="margin:0;"><label>Developer</label><input type="text" id="m-dev" value="${g.Developer}"></div>
                <div class="form-group" style="margin:0;"><label>Repository</label><input type="text" id="m-repo" value="${g.Repository}"></div>
                <div class="form-group" style="margin:0;"><label>Commits</label><input type="number" id="m-commits" value="${g.Commits}"></div>
                <div class="form-group" style="margin:0;"><label>PRs</label><input type="number" id="m-prs" value="${g.PRs}"></div>
            `;
            document.getElementById('employeeModal').classList.add('active');
        }

        function deleteEmployee(idx) {
            if (confirm("Are you sure you want to delete this resource?")) {
                employeeData.splice(idx, 1);
                populateDropdowns();
                updateDashboard();
            }
        }

        function deleteJira(idx) {
            if (confirm("Are you sure you want to delete this Jira issue?")) {
                jiraData.splice(idx, 1);
                updateDashboard();
            }
        }

        function deleteGit(idx) {
            if (confirm("Are you sure you want to delete this Git record?")) {
                gitData.splice(idx, 1);
                updateDashboard();
            }
        }

        function saveRecord() {
            const idx = parseInt(document.getElementById('edit-index').value);
            if (currentTab === 'resources') {
                const rec = {
                    Name: document.getElementById('m-name').value.trim(),
                    Role: document.getElementById('m-role').value.trim(),
                    Location: document.getElementById('m-location').value.trim(),
                    Project: document.getElementById('m-project').value.trim(),
                    FTE: parseFloat(document.getElementById('m-fte').value) || 1.0
                };
                if (!rec.Name) { alert("Name is required."); return; }
                if (idx === -1) employeeData.push(rec);
                else employeeData[idx] = rec;
                populateDropdowns();
            } else if (currentTab === 'jira') {
                const rec = {
                    Assignee: document.getElementById('m-assignee').value.trim(),
                    Project: document.getElementById('m-proj').value.trim(),
                    FromStatus: document.getElementById('m-from').value.trim(),
                    ToStatus: document.getElementById('m-to').value.trim(),
                    Issues: document.getElementById('m-issues').value.trim()
                };
                if (!rec.Assignee && !rec.Issues) { alert("Assignee or Issue is required."); return; }
                if (idx === -1) jiraData.push(rec);
                else jiraData[idx] = rec;
            } else if (currentTab === 'git') {
                const rec = {
                    Developer: document.getElementById('m-dev').value.trim(),
                    Repository: document.getElementById('m-repo').value.trim(),
                    Commits: parseInt(document.getElementById('m-commits').value) || 0,
                    PRs: parseInt(document.getElementById('m-prs').value) || 0
                };
                if (!rec.Developer && !rec.Repository) { alert("Developer or Repository is required."); return; }
                if (idx === -1) gitData.push(rec);
                else gitData[idx] = rec;
            }
            closeModal();
            updateDashboard();
        }
    </script>
</body>
</html>
