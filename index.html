<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resource Allocation, Jira & Git Dashboard</title>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- SheetJS for Excel / CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- CSS Styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="dashboard-layout" id="dashboard-layout">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar-container">
            <div class="panel" id="sidebar-filters-panel">
                <h3>🔍 Filters & Controls</h3>
                <div class="form-group">
                    <label>Project</label>
                    <select id="filter-project" onchange="window.updateDashboard()">
                        <option value="">All Projects</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Role / Discipline</label>
                    <select id="filter-role" onchange="window.updateDashboard()">
                        <option value="">All Roles</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Location</label>
                    <select id="filter-location" onchange="window.updateDashboard()">
                        <option value="">All Locations</option>
                    </select>
                </div>
                <button class="btn-reset" onclick="window.resetFilters()">Reset Filters</button>
            </div>

            <div class="panel" id="sidebar-fte-panel">
                <h3>
                    <span>📊 Project FTE</span>
                    <select id="project-sort-mode" onchange="window.updateDashboard()" style="background: var(--bg-slate-900); border: 1px solid var(--border-slate-800); color: var(--text-slate-100); font-size: 11px; padding: 2px 6px; border-radius: 6px; outline: none; cursor: pointer;">
                        <option value="fte-desc">FTE: High to Low</option>
                        <option value="fte-asc">FTE: Low to High</option>
                        <option value="name-asc">Name: A-Z</option>
                    </select>
                </h3>
                <div id="project-fte-list" class="top-projects-list"></div>
                <div class="sidebar-total">
                    <span style="color: var(--text-slate-400);">Total FTE:</span>
                    <span id="sidebar-total-fte" style="color: var(--cyan-400);">0.00</span>
                </div>
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="main-content">
            <!-- Tabs Navigation -->
            <div class="tabs-header">
                <button class="tab-btn active" id="tab-btn-resources" onclick="window.switchTab('resources')">👥 Resources Allocation</button>
                <button class="tab-btn" id="tab-btn-jira" onclick="window.switchTab('jira')">🎫 Jira Issues</button>
                <button class="tab-btn" id="tab-btn-git" onclick="window.switchTab('git')">💻 Git Activity</button>
            </div>

            <!-- Charts Row -->
            <div class="charts-row" id="charts-section">
                <div class="chart-card">
                    <h3 style="font-size: 14px; color: white; display: flex; align-items: center; gap: 8px;">
                        <span>📊</span> Project FTE Burden & Role Distribution (Click bar to filter)
                    </h3>
                    <div class="chart-container">
                        <canvas id="chartProjectFTE"></canvas>
                    </div>
                </div>
                <div class="chart-card">
                    <h3 style="font-size: 14px; color: white; display: flex; align-items: center; gap: 8px;">
                        <span>🍩</span> Organization Composition
                    </h3>
                    <div class="chart-container">
                        <canvas id="chartOrgComposition"></canvas>
                    </div>
                </div>
            </div>

            <!-- Table Section -->
            <div class="table-card">
                <div class="table-header">
                    <h3 id="table-title">👥 Interactive Resource Table & Edit Suite</h3>
                    <div class="actions-bar">
                        <label class="btn-upload">
                            📂 Import Excel / CSV / JSON
                            <input type="file" accept=".csv, .xlsx, .xls, .json" onchange="window.handleFileUpload(event)">
                        </label>
                        <button class="primary" id="btn-add-action" onclick="window.openModal()">+ Add Employee</button>
                    </div>
                </div>
                <div style="overflow-x: auto; width: 100%;">
                    <table id="main-table">
                        <thead>
                            <tr id="table-header-row"></tr>
                            <tr id="table-filter-row" class="table-filter-row" style="display: none;"></tr>
                        </thead>
                        <tbody id="resource-table-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Form for Add / Edit -->
    <div class="modal-overlay" id="employeeModal">
        <div class="modal">
            <h3 id="modal-title">Add New Employee</h3>
            <input type="hidden" id="edit-index" value="-1">
            <div id="modal-form-body" style="display: flex; flex-direction: column; gap: 14px;"></div>
            <div class="modal-actions">
                <button class="btn-secondary" onclick="window.closeModal()">Cancel</button>
                <button class="primary" onclick="window.saveRecord()">Save</button>
            </div>
        </div>
    </div>

    <!-- JS Scripts (Modular) -->
    <script src="resources.js"></script>
    <script src="jira.js"></script>
    <script src="git.js"></script>
    <script src="app.js"></script>
</body>
</html>
